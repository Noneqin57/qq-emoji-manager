<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect x="40" y="40" width="432" height="432" rx="96" ry="96" fill="url(#bgGrad)"/>
  
  <!-- 表情脸底色 -->
  <circle cx="256" cy="240" r="140" fill="url(#faceGrad)"/>
  
  <!-- 左眼 -->
  <ellipse cx="196" cy="210" rx="24" ry="28" fill="#1F2937"/>
  <circle cx="190" cy="204" r="8" fill="#FFFFFF"/>
  
  <!-- 右眼 -->
  <ellipse cx="316" cy="210" rx="24" ry="28" fill="#1F2937"/>
  <circle cx="310" cy="204" r="8" fill="#FFFFFF"/>
  
  <!-- 微笑嘴巴 -->
  <path d="M 180 280 Q 256 350 332 280" stroke="#1F2937" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- 腮红 -->
  <ellipse cx="160" cy="270" rx="20" ry="12" fill="#F87171" opacity="0.5"/>
  <ellipse cx="352" cy="270" rx="20" ry="12" fill="#F87171" opacity="0.5"/>
  
  <!-- 装饰星星 -->
  <polygon points="420,80 426,96 444,96 430,106 436,124 420,114 404,124 410,106 396,96 414,96" fill="#FBBF24"/>
  <polygon points="90,360 94,372 108,372 98,380 102,394 90,386 78,394 82,380 72,372 86,372" fill="#FBBF24"/>
  
  <!-- 管理图标 - 排列的点 -->
  <rect x="160" y="400" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="208" y="400" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="256" y="400" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.9"/>
  <rect x="304" y="400" width="28" height="28" rx="6" fill="#FFFFFF" opacity="0.9"/>
</svg>
